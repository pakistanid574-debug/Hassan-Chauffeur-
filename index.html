<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Website Closed</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }.card {
  background: #111827;
  border-radius: 16px;
  padding: 40px 32px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  max-width: 500px;
  width: 90%;
}

.error-code {
  font-size: 72px;
  font-weight: bold;
  color: #ef4444;
  margin-bottom: 10px;
}

.title {
  font-size: 24px;
  font-weight: 600;
  margin-bottom: 12px;
}

.message {
  font-size: 16px;
  color: #9ca3af;
  line-height: 1.6;
}

.date {
  margin-top: 20px;
  font-size: 14px;
  color: #6b7280;
}

.btn {
  margin-top: 28px;
  display: inline-block;
  padding: 10px 20px;
  border-radius: 10px;
  background: #ef4444;
  color: white;
  text-decoration: none;
  font-weight: 600;
  transition: 0.2s ease;
}

.btn:hover {
  background: #dc2626;
}

  </style>
</head>
<body>
  <div class="card">
    <div class="error-code">Closed</div>
    <div class="title">Website Closed Permanently</div>
    <div class="message">
      This website has been permanently closed and is no longer available.
      Please contact support if you believe this is a mistake.
    </div>
    <div class="date">Effective Date: March 3, 2026</div>
    <a href="#" class="btn">Go Back</a>
  </div>
</body>
</html>
